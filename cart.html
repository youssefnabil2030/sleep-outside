<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      /* Background الجديد */
      background: #2A7B9B;
      background: linear-gradient(
        90deg,
        rgba(42, 123, 155, 1) 0%,
        rgba(87, 199, 133, 1) 50%,
        rgba(237, 221, 83, 1) 100%
      );
      min-height: 100vh;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    input, textarea, button, select {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    #search {
      margin-bottom: 15px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f9f9f9;
      padding: 12px;
      margin: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 6px;
      transition: background 0.3s;
    }

    li.overdue { background: #ffdddd; }
    li.due-soon { background: #fff2cc; }
    li.completed { text-decoration: line-through; color: gray; background: #d4edda; }

    .buttons button {
      margin-left: 6px;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .buttons button:hover { opacity: 0.8; }

    .done-btn { background: #28a745; color: #fff; }
    .delete-btn { background: #dc3545; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <input type="text" id="taskTitle" placeholder="Task title">
    <textarea id="taskDesc" placeholder="Task description"></textarea>
    <input type="date" id="taskDeadline">
    <button onclick="addTask()">Add Task</button>

    <input type="text" id="search" placeholder="Search tasks..." onkeyup="renderTasks()">

    <select id="filter" onchange="renderTasks()">
      <option value="all">All</option>
      <option value="completed">Completed</option>
      <option value="pending">Pending</option>
    </select>

    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";
      const filter = document.getElementById("filter").value;
      const search = document.getElementById("search").value.toLowerCase();
      const today = new Date();

      tasks.forEach((task, index) => {
        if (filter === "completed" && !task.completed) return;
        if (filter === "pending" && task.completed) return;
        if (task.title.toLowerCase().indexOf(search) === -1 &&
            task.desc.toLowerCase().indexOf(search) === -1) return;

        const li = document.createElement("li");

        // Class based on completion and deadline
        let taskClass = task.completed ? "completed" : "";
        if (!task.completed && task.deadline) {
          const deadlineDate = new Date(task.deadline);
          const diffDays = (deadlineDate - today)/(1000*60*60*24);
          if (diffDays < 0) taskClass = "overdue";
          else if (diffDays <= 3) taskClass = "due-soon";
        }
        li.className = taskClass;

        li.innerHTML = `
          <span>
            <strong>${task.title}</strong> - ${task.desc} 
            ${task.deadline ? `(Due: ${task.deadline})` : ""}
          </span>
          <div class="buttons">
            <button class="done-btn" onclick="toggleComplete(${index})">
              ${task.completed ? "Undo" : "Done"}
            </button>
            <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
          </div>
        `;
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const title = document.getElementById("taskTitle").value.trim();
      const desc = document.getElementById("taskDesc").value.trim();
      const deadline = document.getElementById("taskDeadline").value;

      if (!title) return alert("Task title is required!");

      tasks.push({ title, desc, deadline, completed: false });
      saveTasks();
      renderTasks();

      document.getElementById("taskTitle").value = "";
      document.getElementById("taskDesc").value = "";
      document.getElementById("taskDeadline").value = "";
    }

    function toggleComplete(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function deleteTask(index) {
      if(confirm("Are you sure you want to delete this task?")) {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
      }
    }

    renderTasks();
  </script>
</body>
</html>
